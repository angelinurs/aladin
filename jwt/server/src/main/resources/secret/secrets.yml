oauth:
  kakao:
    client-id: ${KAKAO_CLIENT_ID}
    client-secret: ${KAKAO_CLIENT_SECRET}

    login-uri: ${base-url}/oauth2/authorization/kakao
    login-redirect-uri: ${base-url}/login/oauth2/code/kakao

    logout-uri: https://kauth.kakao.com/oauth/logout
    logout-redirect-uri: ${base-url}/logout

    button-image: https://developers.kakao.com/assets/img/about/logos/kakaolink/kakaolink_btn_medium.png
    front-callback-uri: ${front-url}/oauth/callback

llm:
  huggingface:
    key: ${HUGGINGFACE_API_KEY}
    url: https://router.huggingface.co/hf-inference/models/meta-llama/Llama-3.1-8B-Instruct/v1/chat/completions
    model: "qwen3-30b-a3b"